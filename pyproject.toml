[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "word2eq"
version = "1.0.0"
description = "Math word problem -> equation: reproducible training pipeline and a verified, micro-batched inference service."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
    "pydantic>=2.5",
]
dev = [
    "word2eq[serve]",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
word2eq = "word2eq.cli:main"

[tool.setuptools.packages.find]
include = ["word2eq*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
