name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check word2eq tests scripts
      - name: Unit + integration tests
        run: pytest

  pipeline-gate:
    # End-to-end: train a tiny model, evaluate, and run the promotion gate.
    # Catches breakage anywhere in data -> train -> artifact -> eval, and asserts
    # the grammar constraint still yields 100% well-formed equations.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Smoke train
        run: word2eq train --config configs/smoke.yaml
      - name: Promotion gate
        run: word2eq gate --candidate runs/smoke/metrics.json --baseline baselines/smoke.json --max-drop 0.05
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-model
          path: |
            runs/smoke/artifact
            runs/smoke/metrics.json
            runs/smoke/metrics.jsonl
